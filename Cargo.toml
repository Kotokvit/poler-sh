[package]
name = "poler-sh"
version = "0.2.0"
edition = "2021"
description = "POLER SH: суверенная командная оболочка, терминальный шлюз (Terminal Gateway), нативный AST calc и Native Retrieval (grep/scan по файлам и архивам без распаковки)."
authors = ["Kotokvit <213886740+Kotokvit@users.noreply.github.com>"]
repository = "https://github.com/Kotokvit/poler-sh"
license = "MIT OR Apache-2.0"
keywords = ["shell", "terminal", "gateway", "calculator", "grep", "search"]
categories = ["command-line-utilities"]

[[bin]]
name = "poler-sh"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
aho-corasick = "1.1"
regex = "1.10"
ignore = "0.4"
rayon = "1.10"
memmap2 = "0.9"
memchr = "2"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
zstd = "0.13"
blake3 = "1.5"
zip = { version = "2.2", default-features = false, features = ["deflate", "aes-crypto", "zstd"] }
tar = "0.4"

[profile.release]
lto = "thin"
strip = "symbols"
opt-level = 3
