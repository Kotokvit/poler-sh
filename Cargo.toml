[package]
name = "poler-sh"
version = "0.1.0"
edition = "2021"
description = "POLER SH: суверенная командная оболочка и терминальный шлюз (Terminal Gateway) — REPL, нативный AST calc, конвертер единиц, Windows/Linux словарь, прямое исполнение без форков bash."
authors = ["Kotokvit <213886740+Kotokvit@users.noreply.github.com>"]
repository = "https://github.com/Kotokvit/poler-sh"
license = "MIT OR Apache-2.0"
keywords = ["shell", "terminal", "gateway", "calculator", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "poler-sh"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[profile.release]
lto = "thin"
strip = "symbols"
opt-level = 3
